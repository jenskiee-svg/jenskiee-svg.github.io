<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:url("bg1.png") center center/cover fixed no-repeat;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
overflow:hidden;
}

body::before{
content:"";
position:fixed;
inset:0;
background:rgba(0,0,0,.30);
backdrop-filter:(10px);
z-index:-1;
}

.container{

width:90%;
max-width:900px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.15);

border-radius:25px;

padding:50px;

box-shadow:0 20px 40px rgba(0,0,0,.5);

animation:fadeIn 1s;

}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.profile{

text-align:center;
margin-bottom:35px;

}

.profile img{

width:150px;
height:150px;

border-radius:50%;

object-fit:cover;

border:4px solid white;

box-shadow:0 0 25px white;

transition:.4s;

}

.profile img:hover{

transform:scale(1.08);

box-shadow:0 0 40px white;

}

.profile h1{

margin-top:20px;
font-size:2.4rem;
text-shadow:2px 2px 8px black;

}

.profile p{

margin-top:10px;
font-size:1.05rem;
color:#ddd;
text-shadow:2px 2px 6px black;

}

.contacts{

display:grid;
gap:20px;
margin-top:40px;

}

.contact{

display:flex;
align-items:center;
gap:20px;

background:rgba(255,255,255,.08);

padding:18px 25px;

border-radius:18px;

border:1px solid rgba(255,255,255,.15);

transition:.35s;

text-decoration:none;

color:white;

}

.contact:hover{

transform:translateX(10px);

background:rgba(255,255,255,.15);

box-shadow:0 0 20px rgba(255,255,255,.3);

}

.contact i{

font-size:30px;

width:40px;

text-align:center;

}

.contact span{

font-size:1.05rem;

font-weight:500;

text-shadow:2px 2px 5px black;

}

.back{

position:fixed;

bottom:30px;
right:30px;

width:65px;
height:65px;

background:white;
color:black;

border-radius:50%;

display:flex;
justify-content:center;
align-items:center;

font-size:24px;

text-decoration:none;

box-shadow:0 0 25px white;

transition:.3s;

}

.back:hover{

transform:scale(1.1);

}

@media(max-width:768px){

.container{

padding:30px 20px;

}

.profile h1{

font-size:2rem;

}

.contact{

padding:15px;

}

.contact span{

font-size:.95rem;

}

}

</style>

</head>

<body>

<div class="container">

<div class="profile">

<img src="profile.png" alt=""jenskiee">

<h1>Jenskiee</h1>

<p>

</p>

</div>

</div>
